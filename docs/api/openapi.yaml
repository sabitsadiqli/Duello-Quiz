openapi: 3.1.0
info:
  title: Duello Quiz API
  version: 0.5.0
  summary: REST API of the Duello Quiz backend (MVP).
  description: |
    Contract for the Android app and admin tooling. Owner: `backend-dev`.
    Product rules: `docs/mvp-spec.md`; user stories: `docs/requirements/`.
    The real-time duel runs over a WebSocket (`GET /v1/duel`) and is described in
    `docs/api/duel-protocol.md`.

    ## Conventions
    - All `/v1` endpoints need `Authorization: Bearer <Firebase ID token>`.
      The backend verifies the token with the Firebase Admin SDK and never accepts a
      user id from the request body. The user row is created on the first
      authenticated call to any `/v1/me*`, `/v1/categories`, `/v1/quiz/*` or
      `/v1/daily*` or `/v1/exams*` endpoint (AUTH-06); concurrent first calls create exactly one row.
    - Localized content (category names, question and option texts, explanations,
      image alt texts) is resolved from `Accept-Language` (first supported language
      wins); missing translations fall back to `az`. The MVP only stores `az`.
    - Timestamps are ISO-8601 UTC strings (`date-time`) unless the field name ends in
      `EpochMs` (milliseconds since the Unix epoch, server clock).
    - Errors always have the body `{ "code": "...", "message": "..." }`. `code` is
      stable and is what clients map to localized UI text; `message` is a short
      English hint for developers and logs and must never be shown to users.
    - Unknown JSON fields in requests are ignored; a missing or wrongly typed
      required field returns 400 `validation_failed`, malformed JSON 400 `bad_request`.
    - Image URLs are `mediaBaseUrl + storage key` (immutable files served by Caddy
      with a one-year cache; a new upload always gets a new key). `image` is `null`
      for questions without an image.
    - Day = Baku calendar day: 00:00–24:00 Asia/Baku (UTC+4, no DST) by the server
      clock (OQ-074). `dayKey` is that date as `YYYY-MM-DD`. Device clock and time zone
      are never used; clients show countdowns from `nextResetEpochMs` corrected by
      `serverNowEpochMs`. An activity counts for the day it started (OQ-087); a mock
      exam counts for the day it was submitted (OQ-132).
    - XP, levels and the streak change only as a side effect of the server finalizing
      a quiz session, a daily attempt or a duel; no endpoint accepts progress from the
      client (`docs/mvp-spec.md` §10).

    ## Changes
    | Version | Change |
    | --- | --- |
    | 0.2.0 (2026-10-22) | Daily challenge (`/v1/daily*`), `GET /v1/me/progress`, push tokens and notification settings; `QuizResult.progress`; `DELETE /v1/me` also deletes retention data. Additive only. |
    | 0.3.0 (2026-10-30) | Bot opponent (OQ-106 … OQ-110): `MatchSummary.opponentType`, `MatchSummary.ratingChange` is `null` for bot matches, `Stats.botRecord`; `Stats.record` counts only matches against real players; new XP reasons `duel_bot_played`, `duel_bot_win`, `duel_bot_draw`; `DELETE /v1/me` deletes the user's bot matches. Old clients only see bot matches if they announced the `"bot"` duel capability (`duel-protocol.md` §7a), so for them nothing changes. |
    | 0.4.0 (2026-11-19) | Week row (PROG-11, OQ-D35): `ProgressSummary.week`, exactly 7 days Monday → Sunday of the current Baku week, each with a `state` (`active`, `freeze`, `missed`, `today_pending`, `none`). Additive; older clients ignore it. |
    | 0.5.0 (2026-11-21) | Mock exams "Sınaqlar" Phase 1 (ADR 0002, `docs/requirements/mock-exams.md`, OQ-112 … OQ-131): tag `exams`, `/v1/exams*` (catalogue, variant info, offline package without keys, attempt start/resume, answer batch upsert, listening play counter and resume position (OQ-D43), submit, result, self-assessment, review, history). New error codes `exam_variant_not_found`, `exam_attempt_not_found`, `variant_unavailable`, `variant_version_mismatch`, `exam_attempt_running`, `attempt_closed`, `attempt_not_finished`, `task_not_in_attempt`, `group_not_in_attempt`. `DELETE /v1/me` also deletes exam attempts, answers, written texts, listening plays and self-assessments. Progress source type `exam` (streak only, no XP; the Baku day of the submit counts, OQ-132). Additive. |

    ## Error codes
    | HTTP | code | When |
    | --- | --- | --- |
    | 400 | `bad_request` | Malformed JSON or parameters |
    | 400 | `validation_failed` | Missing or invalid field |
    | 400 | `invalid_display_name` | Display name breaks OQ-042 (length/characters) |
    | 400 | `display_name_not_allowed` | Display name on the blocklist (OQ-030) |
    | 400 | `question_not_in_session` | Answer for a question outside the session |
    | 400 | `invalid_option` | `optionId` does not belong to the question |
    | 400 | `task_not_in_attempt` | Exam answer or self-assessment for a task outside the attempt's version |
    | 400 | `group_not_in_attempt` | Listening update for a group outside the attempt's version |
    | 400 | `invalid_push_token` | Push token empty, longer than 1024 characters or containing whitespace |
    | 401 | `unauthorized` | Missing, invalid, expired or revoked token |
    | 403 | `forbidden` | Admin endpoint without the `admin=true` claim |
    | 404 | `not_found` | Unknown route |
    | 404 | `category_not_found` | Category missing or inactive |
    | 404 | `session_not_found` | Session missing or owned by another user |
    | 404 | `exam_variant_not_found` | Exam variant unknown or not published (package: version not available to the caller) |
    | 404 | `exam_attempt_not_found` | Exam attempt missing or owned by another user |
    | 409 | `variant_unavailable` | Exam start for a variant that is no longer published |
    | 409 | `variant_version_mismatch` | Exam start with an outdated package version |
    | 409 | `exam_attempt_running` | Exam start while an attempt of another variant runs (OQ-124) |
    | 409 | `attempt_closed` | Exam write after submit, after the late-upload window, or from another device after the deadline |
    | 409 | `attempt_not_finished` | Exam result, review or self-assessment before submit or finalization |
    | 409 | `category_not_playable` | Category has fewer than 10 active questions |
    | 409 | `already_answered` | A different answer for this question is stored |
    | 409 | `session_expired` | Answer after the session deadline (server clock) |
    | 409 | `session_closed` | Answer for a finished or expired session |
    | 409 | `daily_unavailable` | No daily challenge today (fewer than 5 active questions) |
    | 409 | `daily_already_played` | Today's daily attempt is finished or expired; the body also carries `result` |
    | 413 | `payload_too_large` | Request body above the limit (image upload: 10 MB) |
    | 415 | `unsupported_media_type` | Body is not `application/json` (image upload: not `multipart/form-data`, or the file is not a PNG/JPEG by its content) |
    | 422 | `import_invalid` | Import payload failed validation; nothing was written |
    | 422 | `image_unreadable` | Uploaded image has PNG/JPEG magic bytes but cannot be decoded |
    | 422 | `image_dimensions_too_large` | Uploaded image has more than 100 million pixels |
    | 429 | `rate_limited` | More than 30 quiz sessions started in the last hour (OQ-022); more than 10 exam attempts started on one Baku day (OQ-124) |
    | 500 | `internal_error` | Unexpected server error |
    | 502 | `auth_provider_error` | Firebase could not be reached while deleting the account |
    | 503 | `service_unavailable` | Health check failed (database unreachable) |
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development (infra/docker-compose.yml)
security:
  - firebaseIdToken: []
tags:
  - name: system
    description: Health and operations.
  - name: me
    description: The signed-in user's profile, stats and match history.
  - name: categories
    description: Playable quiz categories.
  - name: quiz
    description: Single-player category quiz sessions.
  - name: daily
    description: Daily challenge ("Gündəlik çağırış", docs/mvp-spec.md §9).
  - name: progress
    description: XP, levels and streak (docs/mvp-spec.md §10).
  - name: notifications
    description: Push tokens and reminder switches (docs/mvp-spec.md §11).
  - name: exams
    description: Mock exams "Sınaqlar" in DİM format (post-MVP Phase 1, ADR 0002). Never an official DİM exam.
  - name: admin
    description: Content administration (custom claim `admin=true`).

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and database check, with the running build version
      description: |
        Used by Docker, Caddy, uptime monitoring and the deploy job (which can compare
        `commit` with the deployed SHA). No authentication.
      security: []
      responses:
        "200":
          description: Service and database are up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user's profile (creates it on the first call)
      description: |
        Creates the user row on the first authenticated call (AUTH-06). The display
        name comes from the token's `name` claim if it satisfies OQ-042 and the
        blocklist (OQ-030), otherwise it is "Oyunçu NNNN" (random 4 digits). The
        avatar comes from the `picture` claim. Later token claims never overwrite a
        stored name or avatar.

        Email sign-up: the token of a freshly created email account usually has no
        `name` claim yet, so the app calls `PATCH /v1/me` with the name entered at
        sign-up right after the account is created.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [me]
      operationId: updateMe
      summary: Change the display name
      description: |
        Rules (OQ-042, PROF-06): Unicode NFC; leading/trailing whitespace trimmed and
        inner whitespace runs collapsed to one space; then 2–20 code points; allowed
        characters are letters of any script (incl. combining marks), digits, space,
        `-`, `'` and `.`. Control characters, line breaks and emoji are rejected.
        The normalized name is checked against the blocklist (OQ-030). Names are not
        unique. Creates the profile if it does not exist yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: |
            `invalid_display_name`, `display_name_not_allowed`, `validation_failed`
            or `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  value: { code: invalid_display_name, message: "Display name must be 2-20 allowed characters" }
                blocked:
                  value: { code: display_name_not_allowed, message: "Display name is not allowed" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete the account immediately (OQ-014, SET-05)
      description: |
        Deletes the user row, all quiz sessions, session questions and quiz answers,
        daily challenge attempts and answers, XP awards and the XP ledger, XP totals,
        category XP, active days, streak and freeze, notification settings, the
        notification send log, every push token of the user, and all mock-exam
        attempts with their answers, written answer texts, flags, listening plays and
        self-assessments (EXAM-23) (all in the same transaction; the per-day daily
        question sets and the exam content are not personal data and stay),
        anonymizes the user in matches (`player_a`/`player_b`/`winner`/
        `forfeited_by`/`match_answers.user_id` set to NULL, shown to opponents as
        "Silinmiş oyunçu") and then deletes the Firebase user with the Admin SDK.
        Idempotent: a retry after a partial failure completes the deletion and
        still returns 204, also when the profile row is already gone. A user is
        never created by this endpoint. A running duel is ended first as a forfeit
        by this user (`forfeitCause = left`), and a queue entry is removed.
        Email deletion requests (SET-06) use the same operation through the admin CLI
        task `delete-user` (OQ-102, `backend/README.md`); there is no admin HTTP endpoint.
      responses:
        "204":
          description: Account deleted (or already deleted).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: |
            `auth_provider_error`: database data is deleted but the Firebase user
            could not be deleted. The client retries the same call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/me/stats:
    get:
      tags: [me]
      operationId: getMyStats
      summary: Duel record and calibration (PROF-03, PROF-05)
      description: |
        Computed on the server from matches with status `finished` (normal, sudden
        death, draw, forfeit); `abandoned` and `cancelled` matches are not counted
        (OQ-026). `record` counts only matches against real players; matches against
        the bot are counted separately in `botRecord` ("Bota qarşı: …", hidden by the
        app when `botRecord.total = 0`; OQ-110). Calibration counts rounds 1–7 with an
        actively locked Əminlik of both kinds of matches; defaulted picks, missed
        rounds and sudden-death questions are excluded (OQ-027). The client shows
        "Az məlumat" for a level with fewer than 5 picks.
      responses:
        "200":
          description: Stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/matches:
    get:
      tags: [me]
      operationId: getMyMatches
      summary: Recent duels, newest first (PROF-04, OQ-031)
      description: |
        Matches with status `finished` or `abandoned`, newest first (by
        `finishedAt`), against real players and the bot together (`opponentType`).
        `cancelled` matches are not listed. No pagination in the MVP.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: limit
          in: query
          required: false
          description: Number of matches, 1–20.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        "200":
          description: Recent matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Playable categories (HOME-01, OQ-013)
      description: |
        Only categories with `is_active = true` and at least 10 active questions
        (the number of questions per session). Ordered by `sortOrder` ascending,
        ties by `slug`. Clients keep this order. Unknown `iconKey` values are shown
        with a generic icon (OQ-044).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Category list (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/quiz/sessions:
    post:
      tags: [quiz]
      operationId: startQuizSession
      summary: Start a category quiz (QUIZ-01)
      description: |
        Picks 10 distinct random active questions of the category (OQ-021) and
        shuffles the option order per session. The response never contains the
        correct option, `isCorrect` or explanations. The session deadline is
        `startedAt + 10 × (20 s + 1.5 s) + 30 s = 245 s` (server clock). After the
        deadline the server finalizes the session as `expired`, lazily on the next
        access and by a periodic job. Max 30 sessions started per user per hour
        (sliding window, per server instance), then 429 with `Retry-After`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`category_not_found`: category missing or inactive."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`category_not_playable`: fewer than 10 active questions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`rate_limited` (OQ-022)."
          headers:
            Retry-After:
              description: Seconds until a new session can be started.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/quiz/sessions/{sessionId}/answers:
    post:
      tags: [quiz]
      operationId: submitQuizAnswer
      summary: Answer one question (QUIZ-03, QUIZ-04)
      description: |
        One answer per question. `optionId = null` is a timeout (OQ-016) and counts
        as wrong. Checks in this order:
        1. Session must belong to the caller (else 404 `session_not_found`) and the
           question must be in it (400 `question_not_in_session`); a non-null
           `optionId` must belong to the question (400 `invalid_option`).
        2. If an answer for this question is already stored: the same `optionId`
           (including `null`) returns the stored result with 200 (safe retry);
           a different one returns 409 `already_answered` and keeps the stored one.
        3. A finished or expired session returns 409 `session_closed`.
        4. Received after the deadline (server clock) returns 409
           `session_expired`; nothing is stored and the session is expired.
        `elapsedMs` is display data only: it is clamped to 0–20000 for storage and
        never affects correctness or score (OQ-004).
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Answer stored (or the stored result for a retry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          description: "`question_not_in_session`, `invalid_option`, `validation_failed`, `bad_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: "`already_answered`, `session_closed`, `session_expired`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/quiz/sessions/{sessionId}/finish:
    post:
      tags: [quiz]
      operationId: finishQuizSession
      summary: Finish the session and get the result with the review (QUIZ-05, QUIZ-06)
      description: |
        Idempotent: a second call returns the same result. Called before the
        deadline the session becomes `finished`; called after the deadline it is
        finalized as `expired` (if the server did not already do so) and the result
        is returned anyway. Unanswered questions count as not answered. Score =
        correct count (OQ-012); single-player never changes the rating. The review
        lists every wrong or unanswered question in session order; it is only ever
        returned here, after the session is closed.

        `progress`: XP for this session (10 per correct answer to the session's
        category, OQ-081/OQ-084; 0 for a session without any answer; 0 with
        `xpCapped = true` beyond the 20th session with answers on that Baku day,
        OQ-082) and the streak. Awarded once, in the same transaction that closes the
        session (also when the expiry job closes it); a retried finish returns the
        same object.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Final result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /v1/daily:
    get:
      tags: [daily]
      operationId: getDaily
      summary: Today's daily challenge state (DAILY-01)
      description: |
        Creates today's set on first use (server-random, stored, one active question
        per playable category, not used in a daily during the last 60 days, OQ-076).
        Never returns another day. An attempt whose deadline passed is finalized
        here. `result` is set only for `status = finished` and holds the score and
        the squares. Share text (OQ-080): the client builds it from its own string
        resources with `number`, `result.squares`, `result.correctCount`/`total`,
        `streakCurrent` and the Play Store link; no question, option or category data
        is needed or sent.
      responses:
        "200":
          description: Today's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyStatus"
              examples:
                finished:
                  value:
                    dayKey: "2026-10-22"
                    number: 12
                    status: finished
                    questionCount: 5
                    serverNowEpochMs: 1792651200000
                    nextResetEpochMs: 1792699200000
                    attempt: { id: "0b6f3f7e-9d1c-4b8e-8a3a-1f2d3c4b5a69", status: finished, startedAtEpochMs: 1792650000000, deadlineEpochMs: 1792650137500 }
                    result: { correctCount: 3, total: 5, squares: [correct, wrong, correct, correct, unanswered] }
                    streakCurrent: 7
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/daily/attempt:
    post:
      tags: [daily]
      operationId: startDailyAttempt
      summary: Start or resume today's attempt (DAILY-02, DAILY-06)
      description: |
        One attempt per account per Baku day (unique on user and day, also under
        concurrent calls from two devices). The first call creates it (201) with
        `deadlineEpochMs = start + 5 × (20 s + 1.5 s) + 30 s = 137.5 s` (OQ-075); every
        further call before the deadline returns the same attempt (200, `resumed =
        true`, same deadline) with the results of the questions already answered.
        Questions are the day's set in its fixed order, options in their stored order
        (identical for everyone), without correctness data or explanations. After the
        attempt is finished or expired: 409 `daily_already_played` with the stored
        result. Not rate limited; never changes the Elo rating (OQ-078).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "201":
          description: Attempt created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyAttempt"
        "200":
          description: The existing attempt (resume).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyAttempt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            `daily_already_played` (body `DailyAlreadyPlayed` with the stored result) or
            `daily_unavailable` (plain `Error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DailyAlreadyPlayed"
                  - $ref: "#/components/schemas/Error"

  /v1/daily/attempt/{attemptId}/answers:
    post:
      tags: [daily]
      operationId: submitDailyAnswer
      summary: Answer one daily question (DAILY-03, DAILY-10)
      description: |
        Same rules, order of checks and error codes as
        `POST /v1/quiz/sessions/{sessionId}/answers`: unknown attempt or another
        user's → 404 `session_not_found`; question not in the day's set → 400
        `question_not_in_session`; foreign option → 400 `invalid_option`; same retry →
        stored result; different second answer → 409 `already_answered`; closed
        attempt → 409 `session_closed`; after the deadline → 409 `session_expired`
        (not stored). An attempt started yesterday can be answered until its own
        deadline (OQ-087). `optionId = null` is a timeout.
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Answer stored (or the stored result for a retry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          description: "`question_not_in_session`, `invalid_option`, `validation_failed`, `bad_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: "`already_answered`, `session_closed`, `session_expired`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/daily/attempt/{attemptId}/finish:
    post:
      tags: [daily]
      operationId: finishDailyAttempt
      summary: Finish the attempt; result, review, XP and streak (DAILY-04)
      description: |
        Idempotent like the quiz finish. Before the deadline the attempt becomes
        `finished`, after it `expired` (the server also finalizes it at the deadline by
        itself, so XP and the streak are never lost). XP (OQ-081, OQ-084): 10 per
        correct answer to the question's category + 20 completion bonus (overall only),
        if at least one answer (a timeout counts) was sent; no cap. Such an attempt
        makes its day active (OQ-085). `review` lists wrong and unanswered questions
        with the correct option and explanation.
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Final result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /v1/me/progress:
    get:
      tags: [progress]
      operationId: getMyProgress
      summary: XP, overall and category levels, streak (PROG-03 … PROG-08)
      description: |
        Level curve (OQ-083): level n → n+1 needs 100 × n XP; clients use `level`,
        `xpIntoLevel` and `xpForNextLevel` as sent and never derive levels from XP.
        The streak is evaluated against today's Baku day: alive while the last active
        day is today or yesterday, or the day before yesterday while a freeze is held
        (the freeze covers yesterday and is consumed when the user plays today).
        `streakEvent` drives the one-time home messages (PROG-07, PROG-08); the client
        remembers the shown `(type, dayKey)` per account. `categories` lists every
        playable category in `sortOrder` (never-played ones at level 1). `week` is the
        Gündəlik week row: the current Baku week Monday → Sunday with a state per day (v0.4.0).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/push-tokens:
    put:
      tags: [notifications]
      operationId: registerPushToken
      summary: Register or refresh this device's FCM token (NOTIF-02)
      description: |
        Upsert by token (one row per device token). A token registered by another
        account moves to the caller (never kept for both). Refreshes `last_seen`;
        tokens not refreshed for 60 days are deleted, tokens FCM reports as
        `UNREGISTERED`/`INVALID_ARGUMENT` too. `locale` (default `az`) picks the
        language of the notification text (fallback `az`). At most 10 tokens per
        account (the least recently seen are dropped).

        Reminders (OQ-088, OQ-089, OQ-092, OQ-096): FCM "notification" messages with
        title/body from backend i18n and data `{type, dayKey}` only; Android
        `channelId` and `tag` both equal `type` (`daily_reminder` |
        `streak_reminder`), `collapseKey` too. Daily reminder 10:00 Baku if today's
        daily is not started; streak reminder 20:00 Baku if the streak is ≥ 2 and
        today is not active; at most one per type and day; a job missed by more than
        60 minutes is skipped; nothing in 22:00–09:00 Baku; nothing after more than 7
        days without an active day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRequest"
      responses:
        "204":
          description: Stored.
        "400":
          description: "`invalid_push_token`, `validation_failed` (bad `locale`) or `bad_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/push-tokens/{token}:
    delete:
      tags: [notifications]
      operationId: deletePushToken
      summary: Remove this device's token (sign-out, permission revoked)
      description: |
        Deletes the token if it belongs to the caller. Idempotent; always 204.
        The server logs this path as `/v1/me/push-tokens/***` (the token is never logged).
      parameters:
        - name: token
          in: path
          required: true
          description: The FCM token, URL-encoded.
          schema:
            type: string
      responses:
        "204":
          description: Deleted (or not present).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/notification-settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: Reminder switches of the account (NOTIF-06, OQ-091)
      description: Stored per account (all devices). Both default to `true`.
      responses:
        "200":
          description: Switches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: Change the reminder switches
      description: Both fields are required; returns the stored switches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettings"
      responses:
        "200":
          description: Stored switches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/images:
    post:
      tags: [admin]
      operationId: uploadImage
      summary: Upload a question image (admin only)
      description: |
        Requires the Firebase custom claim `admin=true` (else 403 `forbidden`).
        Pipeline (`docs/mvp-spec.md` §5): the type is detected from the file
        content (PNG or JPEG only; the declared type and file name are ignored),
        EXIF orientation is applied, the long side is resized to at most 1024 px
        (never upscaled), the image is encoded as lossy WebP (quality 75) with all
        metadata (EXIF, GPS, XMP, ICC) dropped, a thumbnail with a long side of at
        most 400 px is encoded at quality 70, and the dominant colour is computed.
        Above the size targets (80 000 bytes main, 20 000 bytes thumbnail) the
        quality is lowered in steps of 5 down to 50; this is reported in
        `warnings` (`image_quality_reduced`, `image_over_target` if still above).
        Files are stored as `questions/{id}.webp` and `questions/{id}_thumb.webp`
        and served by Caddy under `mediaBaseUrl`; only metadata is in the database.
        Processing runs on a bounded background dispatcher, the request waits for
        the result. The same original (SHA-256 of the uploaded bytes) is stored
        once: uploading it again returns 200 with the existing image, updates its
        licence data and processes nothing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, licence, author]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG or JPEG, at most 10 MB (10 485 760 bytes).
                licence:
                  type: string
                  description: Free licence or own work, e.g. `CC BY 4.0`.
                author:
                  type: string
                sourceUrl:
                  type: string
                  format: uri
                  description: Optional absolute http(s) URL of the original.
                alt:
                  type: string
                  description: |
                    Optional default alt text as an i18n JSON object, e.g.
                    `{"az": "Kür çayı"}`. A question's own `image.alt` wins.
            encoding:
              file:
                contentType: image/png, image/jpeg
      responses:
        "201":
          description: New image processed and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImage"
        "200":
          description: The same original was uploaded before; the existing image (`created = false`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImage"
        "400":
          description: "`validation_failed` (missing `file`, `licence` or `author`; invalid `sourceUrl` or `alt`) or `bad_request` (malformed multipart)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`: the token has no `admin=true` claim."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "`payload_too_large`: file above 10 MB."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`unsupported_media_type`: not `multipart/form-data`, or the file content is not PNG/JPEG."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`image_unreadable` or `image_dimensions_too_large`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/admin/questions/import:
    post:
      tags: [admin]
      operationId: importQuestions
      summary: Import categories and questions (admin only)
      description: |
        Requires the Firebase custom claim `admin=true` (else 403 `forbidden`).
        Same importer as the CLI (`backend/README.md`). The whole payload is
        validated first (`docs/mvp-spec.md` §8, `content/schema/question.schema.json`,
        category names ≤ 20 characters per language, OQ-045); on any error nothing
        is written and 422 `import_invalid` lists all problems. Otherwise one
        transaction upserts categories by `slug` and questions by `id`
        (`questions.external_id`). Only `status = reviewed` questions are active;
        `draft` and `retired` are stored inactive. Option positions are shuffled
        deterministically per question id, so running the same import twice
        changes nothing. Question images: upload each original first with
        `POST /v1/admin/images` and map every `image.file` to the returned id in
        `images`; a question whose file is not mapped is an `image_missing` issue.
        (The CLI import reads the files from the content directory instead.)
        Licence, author and `sourceUrl` of the question file are written to the
        image; the question's `image.alt` is its alt text. Body limit: 10 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Import applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`: the token has no `admin=true` claim."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "`payload_too_large`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`import_invalid`: nothing was written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportError"

  /v1/exams:
    get:
      tags: [exams]
      operationId: getExamCatalog
      summary: Catalogue of exam types and their published variants (EXAM-01)
      description: |
        Only templates with at least one `published` variant are listed (an empty list
        means: hide the "Sınaqlar" entry). `lastAttempt` is the caller's newest attempt
        of that variant. `accessTier` is reserved for a later paid tier (OQ-126); it is
        `null` (free) for every template and clients must not gate anything on it yet.
        Titles are resolved by `Accept-Language`; the client adds the "(DİM formatında)"
        suffix and the DİM disclaimer from its own strings (EXAM-25).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/exams/variants/{variantId}:
    get:
      tags: [exams]
      operationId: getExamVariant
      summary: Info screen data of a published variant (EXAM-02)
      parameters:
        - $ref: "#/components/parameters/VariantId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Structure, timing, scoring rule and the caller's attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamVariantInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamVariantNotFound"

  /v1/exams/variants/{variantId}/package:
    get:
      tags: [exams]
      operationId: getExamPackage
      summary: Offline package of a variant version, without answer keys (EXAM-03, EXAM-21)
      description: |
        Everything the client needs to run the attempt offline: sections, groups
        (reading passages, listening audio reference), tasks and options in exam order,
        and a manifest of every media file (URL, bytes, SHA-256) to verify the download.
        **Never contains** correct options, explanations, model answers, marking
        criteria, speakers or listening scripts; those come only from the review after
        submit. Downloading starts no timer. `version` defaults to the current published
        version; an older version is served only to a user who has an attempt on it
        (resume on another device). Media files are immutable (`mediaBaseUrl + key`).
      parameters:
        - $ref: "#/components/parameters/VariantId"
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamPackage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamVariantNotFound"

  /v1/exams/attempts:
    post:
      tags: [exams]
      operationId: startExamAttempt
      summary: Start (or resume) an attempt; the server sets the timer (EXAM-04, EXAM-19, EXAM-20)
      description: |
        The only request of an attempt that must be online — always, also with a
        downloaded package, which only makes the start faster (OQ-118, OQ-D48). Order of checks:
        unknown variant → 404 `exam_variant_not_found`; an attempt with the same
        `idempotencyKey` → that attempt (200, `resumed = true`); a `running` attempt of
        the same variant → that attempt (200, `resumed = true`, unchanged times); a
        `running` attempt of another variant → 409 `exam_attempt_running` (OQ-124: at
        most one; fetch it with `GET /v1/exams/attempts/current`); variant not
        published → 409 `variant_unavailable`; `version` not the current one → 409
        `variant_version_mismatch` (download the package again); more than 10 starts on
        this Baku day → 429 `rate_limited` with `Retry-After` until 00:00 Baku.
        Otherwise 201 with `endsAtEpochMs = start + 60 min` (the countdown target and
        the moment the client auto-submits), `deadlineEpochMs = endsAt + 2 min` grace
        and `lateUploadUntilEpochMs = deadline + 24 h` (OQ-117, OQ-118). No pause.
        `isRetake` is true when the caller already finished this variant. Phase 1 only
        supports `mode = subject`. `skipListening = true` (OQ-119, deaf or
        hard-of-hearing users) removes the listening tasks from the estimate; it can only
        be chosen here, before the start (OQ-D42).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExamAttemptRequest"
      responses:
        "201":
          description: Attempt created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamAttempt"
        "200":
          description: Existing attempt (idempotent retry or resume).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamVariantNotFound"
        "409":
          description: "`exam_attempt_running`, `variant_unavailable`, `variant_version_mismatch`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`rate_limited`: 10 starts on this Baku day (OQ-124)."
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until 00:00 Baku.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [exams]
      operationId: listExamAttempts
      summary: The caller's attempts, newest first ("Sınaqlarım", EXAM-20)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Attempts (running ones included).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamAttemptList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/exams/attempts/current:
    get:
      tags: [exams]
      operationId: getCurrentExamAttempt
      summary: The caller's running attempt, if any (home "Davam edən sınaq", EXAM-13)
      description: |
        `attempt` is the `running` attempt or, when its deadline passed but the late
        upload window is open, the `awaiting_upload` one; otherwise `null`.
      responses:
        "200":
          description: Current attempt or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentExamAttempt"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/exams/attempts/{examAttemptId}:
    get:
      tags: [exams]
      operationId: getExamAttempt
      summary: Attempt state with all synced answers (resume, other device)
      description: |
        Stored answers (latest revision per task), flags, written texts and listening
        plays. Never correctness data. An attempt whose late-upload window has passed is
        finalized here first. Another user's attempt → 404 `exam_attempt_not_found`.
      parameters:
        - $ref: "#/components/parameters/ExamAttemptId"
      responses:
        "200":
          description: The attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamAttempt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamAttemptNotFound"

  /v1/exams/attempts/{examAttemptId}/answers:
    put:
      tags: [exams]
      operationId: upsertExamAnswers
      summary: Upload answer revisions in a batch (offline sync, EXAM-06, EXAM-11, EXAM-12, EXAM-13)
      description: |
        Up to 100 entries. Each entry is the full state of one task at a client
        revision: `optionId` (closed task, `null` = cleared), `text` (written task, ≤ 1 000
        characters, stored as typed, `null` = empty) and `flagged`. The server keeps the
        highest revision per task: an equal revision is a no-op (`accepted`), a lower one
        is `ignored` with `stale_revision`. Validation is all-or-nothing: a task outside
        the attempt (400 `task_not_in_attempt`), a foreign option (400 `invalid_option`),
        `text` on a closed task or `optionId` on a written task, too long text or a
        duplicate task in one batch (400 `validation_failed`) → nothing is stored.
        Timing (OQ-118): until `deadlineEpochMs` any device may write and becomes the
        holding device. Until `lateUploadUntilEpochMs` only the holding device may
        upload, and only entries with `savedAtEpochMs ≤ deadlineEpochMs`; later entries
        are `ignored` with `saved_after_deadline`. Other devices, a submitted or
        finalized attempt, or a request after the window → 409 `attempt_closed`.
      parameters:
        - $ref: "#/components/parameters/ExamAttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamAnswerBatch"
      responses:
        "200":
          description: Batch applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamAnswerBatchResult"
        "400":
          description: "`task_not_in_attempt`, `invalid_option`, `validation_failed`, `bad_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamAttemptNotFound"
        "409":
          description: "`attempt_closed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/exams/attempts/{examAttemptId}/answers/{taskId}:
    put:
      tags: [exams]
      operationId: upsertExamAnswer
      summary: Upload one answer revision (same rules as the batch)
      parameters:
        - $ref: "#/components/parameters/ExamAttemptId"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamSingleAnswerWrite"
      responses:
        "200":
          description: Applied (see `accepted` / `ignored`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamAnswerBatchResult"
        "400":
          description: "`task_not_in_attempt`, `invalid_option`, `validation_failed`, `bad_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamAttemptNotFound"
        "409":
          description: "`attempt_closed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/exams/attempts/{examAttemptId}/listening/{groupId}:
    put:
      tags: [exams]
      operationId: updateExamListening
      summary: Sync the listening play counter and position of a group (EXAM-10, OQ-119, OQ-D43)
      description: |
        At most 2 plays; the client counts a play as used once 10 s of it were played
        (pause allowed, no seeking, no speed change) and sends the total. The server
        keeps the maximum of `playsUsed` (above 2 → 400 `validation_failed`) and
        `audioFailed` once true stays true (the group is then excluded from the
        estimate). `positionMs` is the current playback position (OQ-D43); after an
        app kill the client resumes the play paused there (returned in
        `ExamAttemptResponse.listening`). It follows the newest play: an update with a
        higher `playsUsed` than stored always sets it; with the same `playsUsed` the
        later `savedAtEpochMs` wins (last write); an update with a lower `playsUsed`
        never changes it. Negative or above the audio duration → 400
        `validation_failed`. Same timing and device rules as the answers; an entry saved after the
        deadline is ignored (the response shows the stored state). Unknown group → 400
        `group_not_in_attempt`.
      parameters:
        - $ref: "#/components/parameters/ExamAttemptId"
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamListeningUpdate"
      responses:
        "200":
          description: Stored state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamListeningState"
        "400":
          description: "`group_not_in_attempt`, `validation_failed`, `bad_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamAttemptNotFound"
        "409":
          description: "`attempt_closed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/exams/attempts/{examAttemptId}/submit:
    post:
      tags: [exams]
      operationId: submitExamAttempt
      summary: Submit (user or automatic at the deadline); server scoring (EXAM-14, EXAM-15)
      description: |
        Sync pending answers first. Scores with the stored answers and the keys of the
        attempt's version (DİM formula, ADR 0002 §4) and makes the attempt read-only.
        Idempotent: a repeated submit returns the stored result unchanged. `trigger =
        deadline` is the client's auto-submit at `endsAtEpochMs`; the server records
        `deadline` for any submit after `endsAtEpochMs`. After `deadlineEpochMs` only
        the holding device may submit (until `lateUploadUntilEpochMs`; then the server
        has finalized the attempt and returns the result with trigger `server`). A
        submitted attempt with at least one answered task makes the Baku day of the
        submit active for the streak (OQ-132: not the start day, so an attempt started
        at 23:40 and submitted at 00:30 counts for the new day); an attempt the server
        finalized (never submitted) makes no day active. No XP (OQ-125); never changes
        Elo.
      parameters:
        - $ref: "#/components/parameters/ExamAttemptId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitExamRequest"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamAttemptNotFound"
        "409":
          description: "`attempt_closed`: another device after the deadline."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/exams/attempts/{examAttemptId}/result:
    get:
      tags: [exams]
      operationId: getExamResult
      summary: Estimated score with the automatic and the self-assessed part (EXAM-17)
      parameters:
        - $ref: "#/components/parameters/ExamAttemptId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamAttemptNotFound"
        "409":
          $ref: "#/components/responses/AttemptNotFinished"

  /v1/exams/attempts/{examAttemptId}/self-assessment:
    put:
      tags: [exams]
      operationId: putExamSelfAssessment
      summary: Self-assessed marks of written tasks (EXAM-16, OQ-112)
      description: |
        Only after submit or finalization (else 409 `attempt_not_finished`), any time
        later too; marks can be changed or cleared again at any time (OQ-D47). Each entry sets (`mark` one of `0`, `1/3`, `1/2`, `2/3`, `1`) or clears
        (`null`) the mark of one written task; any other value, a closed task or a
        duplicate → 400 `validation_failed`, a task outside the attempt → 400
        `task_not_in_attempt`; nothing is stored then. Returns the recomputed result.
        Marks never give XP or affect anything else (OQ-125).
      parameters:
        - $ref: "#/components/parameters/ExamAttemptId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfAssessmentRequest"
      responses:
        "200":
          description: Recomputed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResult"
        "400":
          description: "`task_not_in_attempt`, `validation_failed`, `bad_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamAttemptNotFound"
        "409":
          $ref: "#/components/responses/AttemptNotFinished"

  /v1/exams/attempts/{examAttemptId}/review:
    get:
      tags: [exams]
      operationId: getExamReview
      summary: Every task with key, explanation, model answer, criteria and the transcript (EXAM-18)
      description: |
        Only after submit or finalization (else 409 `attempt_not_finished`). All tasks
        in exam order with the user's answer, `outcome`, the correct option, the
        explanation; written tasks with model answer, criteria and the self-assessed
        mark; listening groups with the transcript, the voice credits and the audio
        file, which the client may now replay freely with seeking (OQ-D44). Filters
        ("Səhvlər", "Cavabsızlar", "İşarələnmişlər") are applied by the client on
        `outcome` and `flagged`.
      parameters:
        - $ref: "#/components/parameters/ExamAttemptId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExamAttemptNotFound"
        "409":
          $ref: "#/components/responses/AttemptNotFinished"

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authentication ID token of the signed-in user.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred content language; unsupported or missing → `az`.
      schema:
        type: string
        example: az
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExamAttemptId:
      name: examAttemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: "`bad_request` or `validation_failed`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`unauthorized`: missing, invalid or expired Firebase ID token."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: Missing or invalid bearer token
    SessionNotFound:
      description: "`session_not_found`: unknown session or owned by another user."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExamVariantNotFound:
      description: "`exam_variant_not_found`: unknown or unpublished variant."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExamAttemptNotFound:
      description: "`exam_attempt_not_found`: unknown attempt or owned by another user."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AttemptNotFinished:
      description: "`attempt_not_finished`: the attempt is not submitted or finalized yet (no keys before that)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code (see the table in the description).
          examples: [category_not_playable]
        message:
          type: string
          description: Developer hint in English; never shown to users.

    Health:
      type: object
      required: [status, database, version, commit]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
        version:
          type: string
          description: Backend build version (Gradle project version), `unknown` if not available.
          example: 0.1.0
        commit:
          type: [string, "null"]
          description: |
            Git commit SHA the image was built from (Docker build argument `GIT_SHA`);
            null for local runs. Nothing else about the build or its configuration is exposed.
          example: 699c1da3f0b1e2d4c5a6b7c8d9e0f1a2b3c4d5e6

    Profile:
      type: object
      required: [id, displayName, avatarUrl, rating, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Backend user id (also the Analytics user id; never shown in the UI).
        displayName:
          type: string
          minLength: 2
          maxLength: 20
        avatarUrl:
          type: [string, "null"]
          format: uri
        rating:
          type: integer
          description: Elo rating, starts at 1000; changed only by duels.
        createdAt:
          type: string
          format: date-time
          description: When the profile was created; the profile shows it as "Qoşulub" (month and year, PROF-02).

    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          examples: ["Əli Məmmədov"]

    Stats:
      type: object
      required: [record, botRecord, calibration]
      properties:
        record:
          description: Finished matches against real players only (OQ-110).
          $ref: "#/components/schemas/Record"
        botRecord:
          description: Finished matches against the bot (v0.3.0, OQ-110); all zero when there are none.
          $ref: "#/components/schemas/Record"
        calibration:
          type: array
          description: Always three entries, levels 1, 2, 3 in this order.
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [level, picks, correct]
            properties:
              level: { type: integer, enum: [1, 2, 3] }
              picks: { type: integer, minimum: 0, description: "Counted rounds with this level" }
              correct: { type: integer, minimum: 0, description: "Of those, answered correctly" }

    Record:
      type: object
      required: [wins, losses, draws, total]
      properties:
        wins: { type: integer, minimum: 0 }
        losses: { type: integer, minimum: 0 }
        draws: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    MatchHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MatchSummary"

    MatchSummary:
      type: object
      required: [id, opponentType, opponent, result, endReason, forfeitCause, scoreOwn, scoreOpponent, ratingChange, finishedAt]
      properties:
        id:
          type: string
          format: uuid
        opponentType:
          type: string
          enum: [human, bot]
          description: v0.3.0. `bot` = match against the server bot (OQ-106); the app shows the bot avatar and the "Bot" badge.
        opponent:
          type: object
          required: [displayName, avatarUrl, deleted]
          description: |
            Current name of the opponent (names are not copied into matches). A
            deleted opponent has `deleted = true` and null name/avatar; the app
            shows "Silinmiş oyunçu". The bot is `{"displayName": "Duello Bot",
            "avatarUrl": null, "deleted": false}` (name from backend i18n by
            `Accept-Language`).
          properties:
            displayName: { type: [string, "null"] }
            avatarUrl: { type: [string, "null"], format: uri }
            deleted: { type: boolean }
        result:
          type: string
          enum: [win, loss, draw, abandoned]
        endReason:
          type: string
          enum: [normal, sudden_death, draw, forfeit, abandoned]
          description: |
            With `forfeit` the app labels a win "Rəqib tərk etdi" and a loss
            "Texniki məğlubiyyət"; with `sudden_death` "Əlavə sual".
        forfeitCause:
          type: [string, "null"]
          enum: [missed_rounds, left, null]
          description: |
            Why the match was forfeited (OQ-068, OQ-D16): `missed_rounds` (2 missed
            rounds in a row) or `left` (left on purpose or deleted the account).
            `null` unless `endReason = forfeit`, and for forfeits stored before
            2026-10-17. The forfeiting side follows from `result` (loss = own forfeit).
        scoreOwn: { type: integer }
        scoreOpponent: { type: integer }
        ratingChange:
          type: [integer, "null"]
          description: Own rating after − before; 0 for abandoned matches; `null` for bot matches (no rating change, the app shows "—").
        finishedAt:
          type: string
          format: date-time

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    Category:
      type: object
      required: [id, slug, name, iconKey]
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
          examples: [cografiya]
        name:
          type: string
          maxLength: 20
          description: Localized name (Accept-Language, fallback az).
          examples: ["Coğrafiya"]
        iconKey:
          type: string
          description: "Known values (OQ-044): geography, history, biology, physics, sports."
          examples: [geography]

    StartSessionRequest:
      type: object
      required: [categoryId]
      properties:
        categoryId:
          type: integer
          format: int32

    QuizSession:
      type: object
      required: [id, categoryId, startedAtEpochMs, deadlineEpochMs, serverNowEpochMs, questionTimeLimitMs, questions]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: integer
          format: int32
        startedAtEpochMs:
          type: integer
          format: int64
        deadlineEpochMs:
          type: integer
          format: int64
          description: Server deadline for all answers (start + 245 s).
        serverNowEpochMs:
          type: integer
          format: int64
          description: Server clock when the response was built; lets the client compute its clock offset.
        questionTimeLimitMs:
          type: integer
          description: Display timer per question (20000).
        questions:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/SessionQuestion"

    SessionQuestion:
      type: object
      required: [id, position, text, image, options]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
          maximum: 10
        text:
          type: string
        image:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Image"
        options:
          type: array
          minItems: 4
          maxItems: 4
          description: Shuffled per session; no correctness information.
          items:
            $ref: "#/components/schemas/Option"

    Option:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string

    Image:
      type: object
      required: [url, thumbUrl, width, height, dominantColor, alt]
      properties:
        url:
          type: string
          format: uri
          description: WebP, long side ≤ 1024 px.
        thumbUrl:
          type: string
          format: uri
          description: WebP thumbnail, 400 px.
        width: { type: integer }
        height: { type: integer }
        dominantColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        alt:
          type: [string, "null"]
          description: Localized alt text for accessibility (the question's own alt text, else the image's default).

    AdminImage:
      type: object
      required: [id, url, thumbUrl, width, height, bytes, thumbWidth, thumbHeight, thumbBytes, quality, thumbQuality,
                 dominantColor, licence, author, sourceUrl, alt, created, warnings]
      properties:
        id:
          type: string
          format: uuid
          description: Use this id in the `images` map of `POST /v1/admin/questions/import`.
        url: { type: string, format: uri }
        thumbUrl: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer, description: Size of the main WebP file }
        thumbWidth: { type: [integer, "null"] }
        thumbHeight: { type: [integer, "null"] }
        thumbBytes: { type: [integer, "null"] }
        quality: { type: [integer, "null"], description: WebP quality used for the main file }
        thumbQuality: { type: [integer, "null"] }
        dominantColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        licence: { type: [string, "null"] }
        author: { type: [string, "null"] }
        sourceUrl: { type: [string, "null"], format: uri }
        alt:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/I18n"
        created: { type: boolean }
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                enum: [image_quality_reduced, image_over_target]
              message: { type: string }

    SubmitAnswerRequest:
      type: object
      required: [questionId, optionId]
      properties:
        questionId:
          type: string
          format: uuid
        optionId:
          type: [string, "null"]
          format: uuid
          description: "`null` = the 20 s timer ran out (OQ-016)."
        elapsedMs:
          type: integer
          description: Client-measured time to answer; display only, clamped to 0–20000.

    AnswerResult:
      type: object
      required: [questionId, optionId, correct, correctOptionId, explanation]
      properties:
        questionId:
          type: string
          format: uuid
        optionId:
          type: [string, "null"]
          format: uuid
          description: The stored answer.
        correct:
          type: boolean
        correctOptionId:
          type: string
          format: uuid
        explanation:
          type: [string, "null"]
          description: Localized explanation; the app shows it only in the end review (OQ-023).

    QuizResult:
      type: object
      required: [sessionId, status, score, correctCount, total, finishedAt, review, progress]
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [finished, expired]
        score:
          type: integer
          minimum: 0
          maximum: 10
          description: Equals `correctCount` (OQ-012).
        correctCount:
          type: integer
          minimum: 0
          maximum: 10
        total:
          type: integer
          description: Questions in the session (10).
        finishedAt:
          type: string
          format: date-time
        review:
          type: array
          description: Wrong and unanswered questions in session order; empty for 10/10.
          items:
            $ref: "#/components/schemas/ReviewItem"
        progress:
          description: XP and streak change of this session; `null` only for sessions closed before 2026-10-22.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Progress"

    ReviewItem:
      type: object
      required: [questionId, position, text, image, selectedOption, correctOption, explanation]
      properties:
        questionId:
          type: string
          format: uuid
        position:
          type: integer
        text:
          type: string
        image:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Image"
        selectedOption:
          description: "`null` = not answered (timeout or never sent): \"Cavab verilməyib\"."
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Option"
        correctOption:
          $ref: "#/components/schemas/Option"
        explanation:
          type: [string, "null"]

    Progress:
      type: object
      description: |
        What one finalized quiz session, daily attempt or duel did to the player's
        progress (also `match.result.progress` in `duel-protocol.md`). Stored once per
        (user, source); retries return the identical object. Hide the XP row when
        `xpGained = 0`; show the cap note only when `xpCapped = true`.
      required: [dayKey, xpGained, xpCapped, xpBreakdown, xpTotal, levelBefore, levelAfter, xpIntoLevelBefore,
                 xpForNextLevelBefore, xpIntoLevel, xpForNextLevel, categoryLevelUps, streakCurrent, streakBest,
                 streakExtendedToday, freezeAvailable]
      properties:
        dayKey:
          type: string
          format: date
          description: Baku day the activity counted for (the day it started, OQ-087; for a mock exam the day it was submitted, OQ-132).
        xpGained: { type: integer, minimum: 0 }
        xpCapped:
          type: boolean
          description: XP was withheld by a daily cap (OQ-082); the game still counts as played and for the streak.
        xpBreakdown:
          type: array
          items:
            type: object
            required: [reason, categoryId, amount]
            properties:
              reason:
                type: string
                enum: [correct_answers, daily_bonus, duel_played, duel_win, duel_draw, duel_bot_played, duel_bot_win, duel_bot_draw]
                description: |
                  `duel_bot_*` (v0.3.0): half duel XP for a finished match against the bot
                  (10 played, +15 win, +8 draw; OQ-109).
              categoryId:
                type: [integer, "null"]
                description: Set when the amount also counts for that category (correct answers only, OQ-084).
              amount: { type: integer, minimum: 1 }
        xpTotal: { type: integer, format: int64, description: Overall XP after this award }
        levelBefore: { type: integer, minimum: 1 }
        levelAfter: { type: integer, minimum: 1 }
        xpIntoLevelBefore: { type: integer, format: int64, description: Bar start value (animate from before to after) }
        xpForNextLevelBefore: { type: integer, format: int64 }
        xpIntoLevel: { type: integer, format: int64 }
        xpForNextLevel: { type: integer, format: int64 }
        categoryLevelUps:
          type: array
          items:
            type: object
            required: [categoryId, levelBefore, levelAfter]
            properties:
              categoryId: { type: integer }
              levelBefore: { type: integer }
              levelAfter: { type: integer }
        streakCurrent: { type: integer, minimum: 0 }
        streakBest: { type: integer, minimum: 0 }
        streakExtendedToday:
          type: boolean
          description: This result made its day active for the first time (streak highlight, shown once).
        freezeAvailable: { type: boolean, description: A streak freeze is held (max 1, OQ-086) }

    ProgressSummary:
      type: object
      required: [xpTotal, level, xpIntoLevel, xpForNextLevel, streakCurrent, streakBest, todayActive, freezeAvailable,
                 streakEvent, dayKey, nextResetEpochMs, serverNowEpochMs, categories, week]
      properties:
        xpTotal: { type: integer, format: int64 }
        level: { type: integer, minimum: 1 }
        xpIntoLevel: { type: integer, format: int64 }
        xpForNextLevel: { type: integer, format: int64 }
        streakCurrent: { type: integer, minimum: 0 }
        streakBest: { type: integer, minimum: 0 }
        todayActive: { type: boolean, description: Today (Baku) already counts for the streak }
        freezeAvailable: { type: boolean }
        streakEvent:
          description: |
            One-time home message, `null` if none. `freeze_used`: a held freeze covers
            the missed day `dayKey` (yesterday); sent on the day after the missed day,
            before and after the user plays (same key); `previousStreak` = the
            protected streak. `streak_lost`: `dayKey` (the first missed day) was not
            covered; sent from the day after until the end of the day the user plays
            again (same key); `previousStreak` = the lost streak (the app shows the
            message only for ≥ 2).
          oneOf:
            - type: "null"
            - type: object
              required: [type, dayKey, previousStreak]
              properties:
                type: { type: string, enum: [freeze_used, streak_lost] }
                dayKey: { type: string, format: date }
                previousStreak: { type: integer, minimum: 1 }
        dayKey: { type: string, format: date, description: Today (Baku) }
        nextResetEpochMs: { type: integer, format: int64, description: "Next 00:00 Baku" }
        serverNowEpochMs: { type: integer, format: int64 }
        categories:
          type: array
          items:
            type: object
            required: [categoryId, slug, name, iconKey, xp, level, xpIntoLevel, xpForNextLevel]
            properties:
              categoryId: { type: integer }
              slug: { type: string }
              name: { type: string, description: Localized }
              iconKey: { type: string }
              xp: { type: integer, format: int64 }
              level: { type: integer, minimum: 1 }
              xpIntoLevel: { type: integer, format: int64 }
              xpForNextLevel: { type: integer, format: int64 }
        week:
          description: |
            v0.4.0 (PROG-11, OQ-D35). Always exactly 7 entries, ascending from Monday to
            Sunday of the Baku week that contains `dayKey` (ISO week; the week starts at
            00:00 Asia/Baku on Monday, not at UTC midnight). `state` is decided per day
            by the first rule that matches:
            1. a day after today → `none`;
            2. an active day (counted for the streak) → `active`;
            3. today, not active yet → `today_pending`;
            4. a missed day a streak freeze covered, or yesterday while a held freeze
               covers it right now (consumed when the user plays today) → `freeze`;
            5. any other past day after the user's first active day → `missed`;
            6. otherwise (before the first active day, or a new user) → `none`.
            Clients render the states as sent and never derive them.
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required: [dayKey, state]
            properties:
              dayKey: { type: string, format: date, description: Baku date of the day }
              state: { type: string, enum: [active, freeze, missed, today_pending, none] }
          example:
            - { dayKey: "2026-11-16", state: active }
            - { dayKey: "2026-11-17", state: freeze }
            - { dayKey: "2026-11-18", state: active }
            - { dayKey: "2026-11-19", state: today_pending }
            - { dayKey: "2026-11-20", state: none }
            - { dayKey: "2026-11-21", state: none }
            - { dayKey: "2026-11-22", state: none }

    DailyStatus:
      type: object
      required: [dayKey, number, status, questionCount, serverNowEpochMs, nextResetEpochMs, attempt, result, streakCurrent]
      properties:
        dayKey: { type: string, format: date }
        number:
          type: [integer, "null"]
          description: "#N = days since the configured first day + 1; `null` when `unavailable`."
        status:
          type: string
          enum: [available, in_progress, finished, unavailable]
          description: "`finished` covers finished and expired attempts."
        questionCount: { type: integer, description: "5" }
        serverNowEpochMs: { type: integer, format: int64 }
        nextResetEpochMs: { type: integer, format: int64, description: "Next 00:00 Baku (countdown)" }
        attempt:
          description: Today's attempt; `null` when `available` or `unavailable`.
          oneOf:
            - type: "null"
            - type: object
              required: [id, status, startedAtEpochMs, deadlineEpochMs]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [active, finished, expired] }
                startedAtEpochMs: { type: integer, format: int64 }
                deadlineEpochMs: { type: integer, format: int64 }
        result:
          description: Set only when `status = finished`.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DailyResultSummary"
        streakCurrent: { type: integer, minimum: 0, description: Current streak (share text line) }

    DailyResultSummary:
      type: object
      required: [correctCount, total, squares]
      properties:
        correctCount: { type: integer, minimum: 0 }
        total: { type: integer }
        squares:
          type: array
          description: One per question in order (share squares, OQ-080). A timeout is `unanswered`.
          items:
            type: string
            enum: [correct, wrong, unanswered]

    DailyAttempt:
      type: object
      required: [id, dayKey, number, startedAtEpochMs, deadlineEpochMs, serverNowEpochMs, questionTimeLimitMs, resumed,
                 questions, answers]
      properties:
        id: { type: string, format: uuid }
        dayKey: { type: string, format: date, description: The day the attempt belongs to }
        number: { type: integer }
        startedAtEpochMs: { type: integer, format: int64 }
        deadlineEpochMs: { type: integer, format: int64, description: "Start + 137.5 s" }
        serverNowEpochMs: { type: integer, format: int64 }
        questionTimeLimitMs: { type: integer, description: "20000" }
        resumed: { type: boolean }
        questions:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/SessionQuestion"
        answers:
          type: array
          description: Results of the questions already answered (resume); empty for a new attempt.
          items:
            $ref: "#/components/schemas/AnswerResult"

    DailyResult:
      type: object
      required: [attemptId, dayKey, number, status, score, correctCount, total, squares, finishedAt, review, progress,
                 streakCurrent]
      properties:
        attemptId: { type: string, format: uuid }
        dayKey: { type: string, format: date }
        number: { type: integer }
        status: { type: string, enum: [finished, expired] }
        score: { type: integer, minimum: 0, maximum: 5 }
        correctCount: { type: integer, minimum: 0, maximum: 5 }
        total: { type: integer }
        squares:
          type: array
          items: { type: string, enum: [correct, wrong, unanswered] }
        finishedAt: { type: string, format: date-time }
        review:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"
        progress:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Progress"
        streakCurrent: { type: integer, minimum: 0, description: For the share text streak line }

    DailyAlreadyPlayed:
      type: object
      required: [code, message, result]
      properties:
        code: { type: string, const: daily_already_played }
        message: { type: string }
        result:
          $ref: "#/components/schemas/DailyResult"

    PushTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 1024 }
        locale:
          type: string
          description: Language tag of the device UI (`az`, `az-AZ`); default `az`.
          examples: [az]

    NotificationSettings:
      type: object
      required: [dailyReminder, streakReminder]
      properties:
        dailyReminder: { type: boolean, description: "10:00 Baku if today's daily is not started" }
        streakReminder: { type: boolean, description: "20:00 Baku if streak ≥ 2 and today is not active" }

    ImportRequest:
      type: object
      required: [questions]
      properties:
        categories:
          type: array
          description: Optional category upserts by `slug` (e.g. from `content/bank/categories.json`).
          items:
            $ref: "#/components/schemas/ImportCategory"
        questions:
          type: array
          description: Question files exactly as in `docs/mvp-spec.md` §8.
          items:
            $ref: "#/components/schemas/ImportQuestion"
        images:
          type: object
          description: |
            Maps each `image.file` used by the questions (e.g. `images/kur.jpg`) to
            the `id` returned by `POST /v1/admin/images`.
          additionalProperties:
            type: string
            format: uuid

    ImportCategory:
      type: object
      required: [slug, name, iconKey, sortOrder]
      properties:
        slug:
          type: string
          pattern: "^[a-z]+$"
        name:
          type: object
          description: i18n map, `az` required, each value 1–20 characters (OQ-045).
          required: [az]
          properties:
            az: { type: string, minLength: 1, maxLength: 20 }
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 20
        iconKey:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        sortOrder:
          type: integer
        active:
          type: boolean
          default: true

    ImportQuestion:
      description: |
        One question file; authoritative schema:
        `content/schema/question.schema.json` (JSON Schema 2020-12).
        Additional backend rules: `status = reviewed` requires a non-empty
        `reviewedBy`; the four option texts (`az`) must be distinct.
      type: object
      required: [id, category, difficulty, status, text, options, sources, author]
      properties:
        id: { type: string, pattern: "^[a-z]+-[0-9]{4}$" }
        category: { type: string, pattern: "^[a-z]+$" }
        difficulty: { type: integer, enum: [1, 2, 3] }
        status: { type: string, enum: [draft, reviewed, retired] }
        text: { $ref: "#/components/schemas/I18n" }
        options:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [text, correct]
            properties:
              text: { $ref: "#/components/schemas/I18n" }
              correct: { type: boolean }
        explanation: { $ref: "#/components/schemas/I18n" }
        sources:
          type: array
          minItems: 1
          items: { type: string, format: uri }
        image:
          type: [object, "null"]
          description: |
            `null` or `{file, licence, author, sourceUrl?, alt}`; `file` matches
            `^images/[a-z0-9._-]+\.(jpg|jpeg|png|webp)$`.
        author: { type: string }
        reviewedBy: { type: [string, "null"] }

    I18n:
      type: object
      required: [az]
      properties:
        az: { type: string, minLength: 1 }
      additionalProperties:
        type: string
        minLength: 1

    ImportReport:
      type: object
      required: [categoriesCreated, categoriesUpdated, created, updated, unchanged, active, inactive, warnings]
      properties:
        categoriesCreated: { type: integer }
        categoriesUpdated: { type: integer }
        created: { type: integer, description: New questions }
        updated: { type: integer, description: Existing questions whose content or status changed }
        unchanged: { type: integer }
        active: { type: integer, description: Imported questions that are active (reviewed) }
        inactive: { type: integer, description: Imported questions stored inactive (draft/retired) }
        imagesCreated:
          type: integer
          description: Images processed and stored by this run (known originals are reused, so a repeated import reports 0).
        warnings:
          description: Non-fatal findings, e.g. `image_quality_reduced` or `image_over_target` from the image pipeline.
          type: array
          items:
            $ref: "#/components/schemas/ImportIssue"

    ImportError:
      type: object
      required: [code, message, issues]
      properties:
        code:
          type: string
          const: import_invalid
        message:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ImportIssue"

    ImportIssue:
      type: object
      required: [ref, code, message]
      properties:
        ref:
          type: string
          description: Question id, `category:<slug>` or the array index when no id is readable.
        code:
          type: string
          examples: [invalid_field, unknown_category, duplicate_id, category_name_too_long, image_missing,
                     image_unsupported_type, image_too_large, image_unreadable, image_dimensions_too_large,
                     image_quality_reduced, image_over_target]
        message:
          type: string

    # ---------------------------------------------------------------- exams (ADR 0002)

    ExamCatalog:
      type: object
      required: [serverNowEpochMs, templates]
      properties:
        serverNowEpochMs:
          type: integer
          format: int64
        templates:
          type: array
          items:
            $ref: "#/components/schemas/ExamTemplateSummary"

    ExamTemplateSummary:
      type: object
      required: [id, title, stage, mode, language, durationMs, taskCount, accessTier, variants]
      properties:
        id:
          type: string
          examples: [buraxilis-ingilis]
        title:
          type: string
          examples: ["Buraxılış — İngilis dili"]
        stage:
          type: integer
          enum: [1, 2]
        mode:
          type: string
          enum: [subject, full]
        language:
          type: string
          description: Language of the exam content (prompts, passages, audio).
          examples: [en]
        durationMs:
          type: integer
          format: int64
        taskCount:
          type: integer
        accessTier:
          type: [string, "null"]
          description: Reserved for a later paid tier (OQ-126). Always `null` (free) now.
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ExamVariantSummary"

    ExamVariantSummary:
      type: object
      required: [id, number, version, taskCount, packageBytes, lastAttempt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          description: Shown as "Sınaq №<number>".
        version:
          type: integer
        taskCount:
          type: integer
        packageBytes:
          type: integer
          format: int64
          description: Package JSON plus all media files.
        lastAttempt:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ExamAttemptSummary"

    ExamAttemptSummary:
      type: object
      required: [id, variantId, variantNumber, templateId, templateTitle, mode, status, isRetake, dayKey,
                 startedAtEpochMs, endsAtEpochMs, submittedAtEpochMs, estimateTotal, maxScore, writtenAssessed, writtenTotal]
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        variantNumber:
          type: integer
        templateId:
          type: string
        templateTitle:
          type: string
        mode:
          type: string
          enum: [subject, full]
        status:
          $ref: "#/components/schemas/ExamAttemptStatus"
        isRetake:
          type: boolean
          description: Show "Təkrar cəhd" (OQ-124).
        dayKey:
          type: string
          description: Baku day of the start, `YYYY-MM-DD`.
        startedAtEpochMs:
          type: integer
          format: int64
        endsAtEpochMs:
          type: integer
          format: int64
        submittedAtEpochMs:
          type: [integer, "null"]
          format: int64
        estimateTotal:
          type: [number, "null"]
          description: Rounded to 0.1; `null` until submitted or finalized.
        maxScore:
          type: number
          description: Reachable maximum of this attempt (OQ-D42; 100 unless listening is excluded).
        writtenAssessed:
          type: integer
        writtenTotal:
          type: integer

    ExamAttemptStatus:
      type: string
      description: |
        `running` (before `deadlineEpochMs`), `awaiting_upload` (deadline passed, late
        upload window open, not submitted), `submitted` (by the client), `finalized`
        (by the server at the end of the late-upload window).
      enum: [running, awaiting_upload, submitted, finalized]

    ExamAttemptList:
      type: object
      required: [attempts]
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/ExamAttemptSummary"

    ExamVariantInfo:
      type: object
      required: [id, number, version, template, language, mode, durationMs, graceMs, lateUploadWindowMs,
                 listeningMaxPlays, listeningPlayCountsAfterMs, scoring, sections, taskCount, hasListening,
                 hasWritten, packageBytes, attemptCount, lastAttempt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        version:
          type: integer
        template:
          type: object
          required: [id, title, stage, accessTier]
          properties:
            id:
              type: string
            title:
              type: string
            stage:
              type: integer
            accessTier:
              type: [string, "null"]
        language:
          type: string
        mode:
          type: string
          enum: [subject, full]
        durationMs:
          type: integer
          format: int64
          description: 60 min for a subject sınaq (OQ-117). No pause.
        graceMs:
          type: integer
          format: int64
        lateUploadWindowMs:
          type: integer
          format: int64
        listeningMaxPlays:
          type: integer
        listeningPlayCountsAfterMs:
          type: integer
          format: int64
        scoring:
          $ref: "#/components/schemas/ExamScoringRule"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ExamSectionInfo"
        taskCount:
          type: integer
        hasListening:
          type: boolean
        hasWritten:
          type: boolean
          description: Show "Yazılı tapşırıqları sınaqdan sonra özün qiymətləndirəcəksən".
        packageBytes:
          type: integer
          format: int64
        attemptCount:
          type: integer
        lastAttempt:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ExamAttemptSummary"

    ExamScoringRule:
      type: object
      description: |
        Stage 1: score = maxScore · (writtenWeight · W + C) / rawMax, rounded half up to
        0.1; wrong answers never subtract. English: 100/37 · (2·W + C).
      required: [rule, writtenWeight, rawMax, maxScore]
      properties:
        rule:
          type: string
          enum: [stage1]
        writtenWeight:
          type: integer
        rawMax:
          type: integer
        maxScore:
          type: number

    ExamSectionInfo:
      type: object
      required: [id, title, position, closedCount, writtenCount, groupKind]
      properties:
        id:
          type: string
          examples: [listening, language, reading]
        title:
          type: string
        position:
          type: integer
        closedCount:
          type: integer
        writtenCount:
          type: integer
        groupKind:
          type: [string, "null"]
          enum: [reading, listening, null]

    ExamPackage:
      type: object
      required: [variantId, version, templateId, language, durationMs, graceMs, optionCount, listeningMaxPlays,
                 listeningPlayCountsAfterMs, maxTextLength, sections, groups, tasks, media, packageBytes]
      properties:
        variantId:
          type: string
          format: uuid
        version:
          type: integer
        templateId:
          type: string
        language:
          type: string
        durationMs:
          type: integer
          format: int64
        graceMs:
          type: integer
          format: int64
        optionCount:
          type: integer
          minimum: 2
          maximum: 5
        listeningMaxPlays:
          type: integer
        listeningPlayCountsAfterMs:
          type: integer
          format: int64
        maxTextLength:
          type: integer
          description: Max characters of a written answer (1 000).
        sections:
          type: array
          items:
            type: object
            required: [id, title, position]
            properties:
              id:
                type: string
              title:
                type: string
              position:
                type: integer
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ExamPackageGroup"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ExamPackageTask"
        media:
          type: array
          description: Every file to download before "Başla" is enabled.
          items:
            $ref: "#/components/schemas/ExamMedia"
        packageBytes:
          type: integer
          format: int64

    ExamPackageGroup:
      type: object
      required: [id, kind, sectionId, position, title, instructions, passage, audio]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [reading, listening]
        sectionId:
          type: string
        position:
          type: integer
        title:
          type: [string, "null"]
        instructions:
          type: [string, "null"]
          description: Localized instruction text.
        passage:
          type: [string, "null"]
          description: |
            Reading text (reading groups only) in restricted markup: paragraphs separated
            by a blank line, `**bold**`, `*italic*`, `__underline__` (ADR 0002 §2).
        audio:
          description: Listening groups only. Play from the downloaded file, never streamed.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ExamMedia"

    ExamPackageTask:
      type: object
      required: [id, position, sectionId, groupId, type, answerFormat, prompt, options]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          description: 1-based number in the exam ("14 / 30").
        sectionId:
          type: string
        groupId:
          type: [string, "null"]
          format: uuid
        type:
          type: string
          enum: [closed_single, written]
        answerFormat:
          type: [string, "null"]
          enum: [short_text, null]
          description: Written tasks only.
        prompt:
          type: string
        options:
          type: array
          description: Closed tasks only (empty for written). No correctness data.
          items:
            type: object
            required: [id, letter, text]
            properties:
              id:
                type: string
                format: uuid
              letter:
                type: string
                examples: [A]
              text:
                type: string

    ExamMedia:
      type: object
      required: [url, bytes, sha256, contentType, durationMs]
      properties:
        url:
          type: string
          format: uri
        bytes:
          type: integer
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        contentType:
          type: string
          examples: [audio/mp4]
        durationMs:
          type: [integer, "null"]

    StartExamAttemptRequest:
      type: object
      required: [variantId, version, deviceId, idempotencyKey]
      properties:
        variantId:
          type: string
          format: uuid
        version:
          type: integer
          description: Version of the downloaded package.
        deviceId:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: Random id per app install (not a hardware id).
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        mode:
          type: string
          enum: [subject]
          default: subject
        skipListening:
          type: boolean
          default: false

    ExamAttempt:
      type: object
      required: [id, variantId, version, templateId, mode, status, isRetake, skipListening, resumed, startedAtEpochMs,
                 endsAtEpochMs, deadlineEpochMs, lateUploadUntilEpochMs, serverNowEpochMs, submittedAtEpochMs,
                 answers, listening]
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        version:
          type: integer
        templateId:
          type: string
        mode:
          type: string
          enum: [subject, full]
        status:
          $ref: "#/components/schemas/ExamAttemptStatus"
        isRetake:
          type: boolean
        skipListening:
          type: boolean
        resumed:
          type: boolean
        startedAtEpochMs:
          type: integer
          format: int64
        endsAtEpochMs:
          type: integer
          format: int64
          description: Countdown target shown to the user (OQ-D41); the client disables input and auto-submits here.
        deadlineEpochMs:
          type: integer
          format: int64
          description: endsAt + 2 min grace (server side, never shown as the countdown); last moment for normal online writes.
        lateUploadUntilEpochMs:
          type: integer
          format: int64
        serverNowEpochMs:
          type: integer
          format: int64
        submittedAtEpochMs:
          type: [integer, "null"]
          format: int64
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ExamAnswer"
        listening:
          type: array
          items:
            $ref: "#/components/schemas/ExamListeningState"

    CurrentExamAttempt:
      type: object
      required: [attempt]
      properties:
        attempt:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ExamAttempt"

    ExamAnswer:
      type: object
      required: [taskId, revision, optionId, text, flagged, savedAtEpochMs]
      properties:
        taskId:
          type: string
          format: uuid
        revision:
          type: integer
        optionId:
          type: [string, "null"]
          format: uuid
        text:
          type: [string, "null"]
        flagged:
          type: boolean
        savedAtEpochMs:
          type: integer
          format: int64

    ExamAnswerWrite:
      type: object
      required: [taskId, revision, savedAtEpochMs]
      properties:
        taskId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Per task, increases with every local change.
        optionId:
          type: [string, "null"]
          format: uuid
          description: Closed tasks; `null` = no answer (cleared).
        text:
          type: [string, "null"]
          maxLength: 1000
          description: Written tasks; stored as typed.
        flagged:
          type: boolean
          default: false
        savedAtEpochMs:
          type: integer
          format: int64
          description: When the client saved it locally (client clock corrected by the server offset).

    ExamSingleAnswerWrite:
      type: object
      required: [deviceId, revision, savedAtEpochMs]
      properties:
        deviceId:
          type: string
        revision:
          type: integer
          minimum: 1
          maximum: 1000000
        optionId:
          type: [string, "null"]
          format: uuid
        text:
          type: [string, "null"]
          maxLength: 1000
        flagged:
          type: boolean
          default: false
        savedAtEpochMs:
          type: integer
          format: int64

    ExamAnswerBatch:
      type: object
      required: [deviceId, answers]
      properties:
        deviceId:
          type: string
        answers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ExamAnswerWrite"

    ExamAnswerBatchResult:
      type: object
      required: [status, serverNowEpochMs, accepted, ignored]
      properties:
        status:
          $ref: "#/components/schemas/ExamAttemptStatus"
        serverNowEpochMs:
          type: integer
          format: int64
        accepted:
          type: array
          description: Entries now stored (or already stored with this revision).
          items:
            type: object
            required: [taskId, revision]
            properties:
              taskId:
                type: string
                format: uuid
              revision:
                type: integer
        ignored:
          type: array
          description: Entries not applied; the client can drop them from its queue.
          items:
            type: object
            required: [taskId, revision, reason]
            properties:
              taskId:
                type: string
                format: uuid
              revision:
                type: integer
              reason:
                type: string
                enum: [stale_revision, saved_after_deadline]

    ExamListeningUpdate:
      type: object
      required: [deviceId, playsUsed, savedAtEpochMs]
      properties:
        deviceId:
          type: string
        playsUsed:
          type: integer
          minimum: 0
          maximum: 2
        audioFailed:
          type: boolean
          default: false
        savedAtEpochMs:
          type: integer
          format: int64
        positionMs:
          type: integer
          minimum: 0
          default: 0
          description: Current playback position, at most the audio `durationMs` (OQ-D43).

    ExamListeningState:
      type: object
      required: [groupId, playsUsed, playsLeft, audioFailed, positionMs]
      properties:
        groupId:
          type: string
          format: uuid
        playsUsed:
          type: integer
        playsLeft:
          type: integer
        audioFailed:
          type: boolean
        positionMs:
          type: integer
          minimum: 0
          description: Stored playback position; resume the play paused here after an app kill (OQ-D43). 0 if never reported.

    SubmitExamRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string
        trigger:
          type: string
          enum: [user, deadline]
          default: user

    ExamResult:
      type: object
      required: [attemptId, variantId, version, templateId, mode, status, isRetake, submitTrigger, submittedAtEpochMs,
                 estimate, closed, written, sections, answeredCount, flaggedCount, progress]
      properties:
        attemptId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        version:
          type: integer
        templateId:
          type: string
        mode:
          type: string
          enum: [subject, full]
        status:
          type: string
          enum: [submitted, finalized]
        isRetake:
          type: boolean
        submitTrigger:
          type: string
          enum: [user, deadline, server]
        submittedAtEpochMs:
          type: integer
          format: int64
        estimate:
          $ref: "#/components/schemas/ExamEstimate"
        closed:
          type: object
          required: [correct, wrong, blank, total]
          properties:
            correct:
              type: integer
            wrong:
              type: integer
            blank:
              type: integer
            total:
              type: integer
        written:
          type: object
          required: [assessed, total, marks, maxMarks]
          properties:
            assessed:
              type: integer
            total:
              type: integer
            marks:
              type: number
              description: Sum of self-assessed marks, 2 decimals (e.g. 4.33).
            maxMarks:
              type: integer
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ExamSectionResult"
        answeredCount:
          type: integer
        flaggedCount:
          type: integer
        progress:
          description: Streak change of this attempt (no XP, OQ-125); `null` for a server finalization.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Progress"

    ExamEstimate:
      type: object
      description: |
        "Təxmini bal" — never an official DİM result. `autoScore` is "Avtomatik
        yoxlanılıb", `writtenScore` "Özün qiymətləndirdin"; both are rounded on their
        own, so their sum may differ from `total` by 0.1. Show numbers with a decimal
        comma. OQ-D42: when listening is excluded (skipped or audio failed) the score is
        **not** rescaled: `total` keeps the template denominator and `maxScore` is the
        reduced reachable maximum, shown as "58,4 / 75,7" (otherwise `maxScore` = 100).
      required: [total, autoScore, writtenScore, maxScore, rawMax, listeningExcluded, listeningExclusionReason]
      properties:
        total:
          type: number
          examples: [67.7]
        autoScore:
          type: number
        writtenScore:
          type: number
        maxScore:
          type: number
          description: Reachable maximum, 100 unless listening is excluded (English then 75.7).
        rawMax:
          type: integer
          description: Counted raw maximum, 37 for English; 28 when listening is excluded.
        listeningExcluded:
          type: boolean
        listeningExclusionReason:
          type: [string, "null"]
          enum: [skipped, audio_failed, null]

    ExamSectionResult:
      type: object
      required: [id, title, closedCorrect, closedWrong, closedBlank, closedTotal, writtenAssessed, writtenTotal,
                 writtenMarks, excluded]
      properties:
        id:
          type: string
        title:
          type: string
        closedCorrect:
          type: integer
        closedWrong:
          type: integer
        closedBlank:
          type: integer
        closedTotal:
          type: integer
        writtenAssessed:
          type: integer
        writtenTotal:
          type: integer
        writtenMarks:
          type: number
        excluded:
          type: boolean
          description: Listening excluded from the estimate.

    SelfAssessmentRequest:
      type: object
      required: [marks]
      properties:
        marks:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [taskId, mark]
            properties:
              taskId:
                type: string
                format: uuid
              mark:
                type: [string, "null"]
                enum: ["0", "1/3", "1/2", "2/3", "1", null]

    ExamReview:
      type: object
      required: [attemptId, variantId, version, language, sections, groups, tasks]
      properties:
        attemptId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        version:
          type: integer
        language:
          type: string
        sections:
          type: array
          items:
            type: object
            required: [id, title, position]
            properties:
              id:
                type: string
              title:
                type: string
              position:
                type: integer
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ExamReviewGroup"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ExamReviewTask"

    ExamReviewGroup:
      type: object
      required: [id, kind, sectionId, position, title, instructions, passage, audio, transcript, voices]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [reading, listening]
        sectionId:
          type: string
        position:
          type: integer
        title:
          type: [string, "null"]
        instructions:
          type: [string, "null"]
        passage:
          type: [string, "null"]
        audio:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ExamMedia"
        transcript:
          type: array
          description: Listening script (empty for reading groups). Only after submit.
          items:
            type: object
            required: [speaker, speakerName, text]
            properties:
              speaker:
                type: string
              speakerName:
                type: string
              text:
                type: string
        voices:
          type: array
          description: TTS credits of the audio (licences screen).
          items:
            type: object
            required: [role, voice, speakerId, licence]
            properties:
              role:
                type: string
              voice:
                type: string
              speakerId:
                type: [integer, "null"]
              licence:
                type: string

    ExamReviewTask:
      type: object
      required: [id, position, sectionId, groupId, type, prompt, options, selectedOptionId, correctOptionId, outcome,
                 text, flagged, explanation, modelAnswer, criteria, selfMark]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        sectionId:
          type: string
        groupId:
          type: [string, "null"]
          format: uuid
        type:
          type: string
          enum: [closed_single, written]
        prompt:
          type: string
        options:
          type: array
          items:
            type: object
            required: [id, letter, text, correct]
            properties:
              id:
                type: string
                format: uuid
              letter:
                type: string
              text:
                type: string
              correct:
                type: boolean
        selectedOptionId:
          type: [string, "null"]
          format: uuid
        correctOptionId:
          type: [string, "null"]
          format: uuid
        outcome:
          type: string
          description: |
            Closed: `correct`, `wrong`, `blank`. Written: `assessed`, `not_assessed`.
            Any task of an excluded listening group: `excluded`.
          enum: [correct, wrong, blank, assessed, not_assessed, excluded]
        text:
          type: [string, "null"]
          description: The user's written answer.
        flagged:
          type: boolean
        explanation:
          type: [string, "null"]
        modelAnswer:
          type: [string, "null"]
        criteria:
          type: array
          items:
            type: object
            required: [mark, description]
            properties:
              mark:
                type: string
                enum: ["0", "1/3", "1/2", "2/3", "1"]
              description:
                type: string
        selfMark:
          type: [string, "null"]
          enum: ["0", "1/3", "1/2", "2/3", "1", null]
