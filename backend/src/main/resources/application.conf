# Duello Quiz backend configuration (HOCON). Every deploy-specific value can be set by
# an environment variable (the `${?VAR}` lines). No secrets in this file.
ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [com.sabit.duelloquiz.backend.ApplicationKt.module]
  }
}

duello {
  db {
    url = "jdbc:postgresql://localhost:5432/duello"
    url = ${?DB_URL}
    user = "duello"
    user = ${?DB_USER}
    password = ""
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
  }

  firebase {
    # Path to the Firebase Admin service-account JSON (mounted file, never in git).
    # Empty: every authenticated request gets 401 (handy for local /health checks).
    serviceAccountFile = ""
    serviceAccountFile = ${?FIREBASE_SERVICE_ACCOUNT_FILE}
    # Optional; taken from the service account when empty.
    projectId = ""
    projectId = ${?FIREBASE_PROJECT_ID}
  }

  media {
    # Root of ImageStorage (Docker volume); Caddy serves it at /media/*.
    dir = "build/media"
    dir = ${?MEDIA_DIR}
    baseUrl = "http://localhost:8080/media"
    baseUrl = ${?MEDIA_BASE_URL}
  }

  # Game numbers (docs/mvp-spec.md §1, OQ-022, OQ-023). Deadline = N × (time + reveal) + grace = 245 s.
  quiz {
    questionsPerSession = 10
    questionTimeMs = 20000
    revealMs = 1500
    graceMs = 30000
    sessionsPerHour = 30
    # How often overdue sessions are finalized as `expired`; 0 disables the job.
    expirySweepIntervalMs = 60000
  }

  displayName {
    # Optional private blocklist (OQ-030), one term per line; lives in the private content repo.
    blocklistFile = ""
    blocklistFile = ${?DISPLAY_NAME_BLOCKLIST_FILE}
  }

  import {
    maxBodyBytes = 10485760
  }

  # Image pipeline (docs/mvp-spec.md §5). Sizes in bytes; targets are decimal KB.
  images {
    maxUploadBytes = 10485760
    # Decompression-bomb guard: larger sources are rejected before decoding.
    maxSourcePixels = 100000000
    maxLongSide = 1024
    thumbLongSide = 400
    quality = 75
    thumbQuality = 70
    # Quality is lowered in steps down to minQuality while a file is above its target.
    minQuality = 50
    qualityStep = 5
    targetBytes = 80000
    thumbTargetBytes = 20000
    # Images processed at the same time (CPU and memory bound).
    parallelism = 1
  }

  # Duel numbers (docs/mvp-spec.md §2, docs/api/duel-protocol.md §2). Protocol limits
  # (version, message size, rate) are part of the contract and live in code.
  duel {
    regularRounds = 7
    maxSuddenDeath = 3
    introMs = 3000
    questionMs = 3000
    confidenceMs = 5000
    answerMs = 10000
    resultMs = 3000
    # OQ-036: picks/answers received at or before deadline + grace count.
    graceMs = 250
    queueTimeoutMs = 30000
    reconnectWindowMs = 10000
    maxBet3PerMatch = 2
    missedRoundsToForfeit = 2
    eloK = 32
    heartbeatIntervalMs = 5000
    heartbeatTimeoutMs = 15000

    # Bot opponent (docs/mvp-spec.md §2 "Bot opponent", OQ-106, OQ-108;
    # docs/api/duel-protocol.md §7a). Off → the 30 s queue timeout only.
    bot {
      enabled = true
      enabled = ${?DUEL_BOT_ENABLED}
      # A lone bot-capable player gets the bot this long after queue.joined.
      waitMs = 15000
      # p = clamp(baseP + perRatingPoint × (rating − ratingPivot) + difficultyAdjust[d−1] + form, minP, maxP)
      baseP = 0.62
      perRatingPoint = 0.0005
      ratingPivot = 1000
      difficultyAdjust = [0.10, 0.0, -0.10]
      # form = ±formAdjust if the player won ≥ formHighWins / ≤ formLowWins of their last formWindow bot matches.
      formAdjust = 0.05
      formWindow = 10
      formHighWins = 7
      formLowWins = 3
      minP = 0.45
      maxP = 0.80
      # Weights of Əminlik 1, 2, 3.
      knowsBetWeights = [0.15, 0.40, 0.45]
      notKnowsBetWeights = [0.65, 0.30, 0.05]
      # Round 7 (All-in), knows and a 3 left.
      allInKnowsBet3 = 0.70
      pickMinMs = 1000
      pickMaxMs = 4000
      answerMinMs = 3000
      answerMaxMs = 9000
    }
  }

  # Daily challenge (docs/mvp-spec.md §9, OQ-075, OQ-076). Deadline = 5 × 21.5 s + 30 s = 137.5 s.
  daily {
    questions = 5
    questionTimeMs = 20000
    revealMs = 1500
    graceMs = 30000
    # Baku date of challenge #1.
    firstDay = "2026-10-22"
    firstDay = ${?DAILY_FIRST_DAY}
    reuseWindowDays = 60
  }

  # XP, levels, streak (docs/mvp-spec.md §10, OQ-081, OQ-082, OQ-086).
  progress {
    quizXpPerCorrect = 10
    dailyXpPerCorrect = 10
    dailyCompletionBonus = 20
    duelPlayedXp = 20
    duelWinXp = 30
    duelDrawXp = 15
    # Bot matches: half the duel XP, draw 7.5 rounded up (OQ-109).
    duelBotPlayedXp = 10
    duelBotWinXp = 15
    duelBotDrawXp = 8
    quizSessionsPerDay = 20
    duelMatchesPerDay = 20
    duelSameOpponentPerDay = 3
    freezeEveryDays = 7
  }

  # Push reminders via FCM (docs/mvp-spec.md §11, OQ-088, OQ-089, OQ-092). Times are Baku time.
  # Needs the Firebase service account; without it nothing is sent.
  notifications {
    enabled = true
    enabled = ${?NOTIFICATIONS_ENABLED}
    tickIntervalMs = 60000
    dailyReminderAt = "10:00"
    streakReminderAt = "20:00"
    sendWindowMinutes = 60
    quietStart = "22:00"
    quietEnd = "09:00"
    inactiveAfterDays = 7
    minStreak = 2
    tokenStaleDays = 60
    logRetentionDays = 90
    maxTokensPerUser = 10
  }
}
