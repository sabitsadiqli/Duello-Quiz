name: Deploy Backend

# Builds the backend image (linux/amd64 + linux/arm64 for the Oracle Ampere A1 VM),
# pushes it to ghcr.io and deploys it over SSH (runbook: infra/README.md).
#   push to main (backend/**, infra/prod/**) -> image :<sha> + :main -> GitHub Environment "dev"
#   workflow_dispatch with a version         -> image :<sha> + :<version> -> "prod"
#                                               (ask Sabit first; prod has required reviewers)
# Tests are not repeated here: main is protected and ci-backend.yml must pass on the PR.
#
# SINGLE REPLICA: the duel queue and running matches live in the backend's memory
# (OQ-070). Every deploy restarts it and abandons running matches (OQ-067): deploy
# during quiet hours.
#
# Until the VM exists, the deploy job skips itself with a notice when the deploy
# secrets are missing (dev), so main stays green. A prod run without them fails.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/prod/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for prod, e.g. 0.3.0 (becomes an image tag)"
        required: true
        type: string

# One deploy per environment at a time; a running deploy is never cancelled.
concurrency:
  group: deploy-backend-${{ github.event_name == 'workflow_dispatch' && 'prod' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sabitsadiqli/duello-quiz-backend

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_tag: ${{ steps.tags.outputs.deploy_tag }}
    steps:
      - name: Resolve image tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version '$VERSION' must look like 1.2.3"
              exit 1
            fi
            extra="$VERSION"
            deploy_tag="$VERSION"
          else
            extra="main"
            deploy_tag="$SHA"
          fi
          {
            echo "tags=$IMAGE:$SHA,$IMAGE:$extra"
            echo "extra=$extra"
            echo "deploy_tag=$deploy_tag"
          } >> "$GITHUB_OUTPUT"
          echo "image tags: $SHA, $extra; deploy tag: $deploy_tag"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A prod release of a commit that main already built only adds the version tag
      # to the existing multi-arch image (no rebuild, saves CI minutes).
      - name: Look for an existing image of this commit
        id: existing
        env:
          SHA: ${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$SHA" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:$SHA exists; retagging instead of rebuilding."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag existing image
        if: steps.existing.outputs.found == 'true'
        env:
          SHA: ${{ github.sha }}
          EXTRA: ${{ steps.tags.outputs.extra }}
        run: docker buildx imagetools create --tag "$IMAGE:$EXTRA" "$IMAGE:$SHA"

      - uses: actions/checkout@v7
        if: steps.existing.outputs.found != 'true'

      # The Gradle stage runs natively (--platform=$BUILDPLATFORM); QEMU only assembles
      # the small arm64 runtime stage.
      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.found != 'true'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.found != 'true'

      - name: Build and push (linux/amd64, linux/arm64)
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.extra }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max

  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && 'prod' || 'dev' }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'prod' || 'dev' }}
      url: ${{ vars.DEPLOY_DOMAIN && format('https://{0}', vars.DEPLOY_DOMAIN) || '' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/duello' }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      DEPLOY_TAG: ${{ needs.image.outputs.deploy_tag }}
    steps:
      - name: Check deploy configuration
        id: config
        env:
          EVENT: ${{ github.event_name }}
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          missing=""
          [ "$HAS_KEY" = "true" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_DOMAIN" ] || missing="$missing DEPLOY_DOMAIN(variable)"
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::Not configured for this environment:$missing. See infra/README.md."
            exit 1
          fi
          echo "::notice::Deploy skipped, not configured yet:$missing. The image $IMAGE:$DEPLOY_TAG was pushed. See infra/README.md."

      - uses: actions/checkout@v7
        if: steps.config.outputs.enabled == 'true'
        with:
          sparse-checkout: infra/prod

      - name: Set up SSH
        if: steps.config.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the host key seen now (ssh-keyscan). Set it, see infra/README.md."
            ssh-keyscan -p "$DEPLOY_PORT" -T 15 "$DEPLOY_HOST" > ~/.ssh/known_hosts 2> /dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host duello-vm
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy compose file, Caddyfile and scripts
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra/prod
        run: |
          set -euo pipefail
          ssh duello-vm "mkdir -p '$DEPLOY_PATH/scripts'"
          scp -q docker-compose.yml Caddyfile .env.example "duello-vm:$DEPLOY_PATH/"
          scp -q scripts/*.sh "duello-vm:$DEPLOY_PATH/scripts/"
          ssh duello-vm "chmod 755 '$DEPLOY_PATH'/scripts/*.sh"

      - name: Pull and restart (docker compose pull && up -d)
        if: steps.config.outputs.enabled == 'true'
        run: ssh duello-vm "'$DEPLOY_PATH/scripts/deploy.sh' '$DEPLOY_TAG'"

      - name: Check https://${{ vars.DEPLOY_DOMAIN }}/health
        if: steps.config.outputs.enabled == 'true'
        run: |
          for attempt in $(seq 1 24); do
            if body="$(curl -fsS --max-time 10 "https://$DEPLOY_DOMAIN/health")"; then
              echo "healthy: $body"
              exit 0
            fi
            echo "attempt $attempt: not healthy yet"
            sleep 5
          done
          echo "::error::https://$DEPLOY_DOMAIN/health is not healthy after the deploy of $DEPLOY_TAG. Roll back on the VM: $DEPLOY_PATH/scripts/deploy.sh <previous-tag>"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
