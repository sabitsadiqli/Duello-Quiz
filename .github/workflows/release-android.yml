name: Release Android

# Builds a signed AAB for a version tag and uploads it to a Google Play TESTING track.
#   v1.2.3          -> internal testing
#   v1.2.3-closed   -> closed testing (Play API track "alpha")
# workflow_dispatch (run it on a tag) can pick the track explicitly.
# The production track is never used; promotion to production is manual in Play Console.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play testing track"
        type: choice
        options: [internal, closed]
        default: internal

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_NAME: com.sabit.duelloquiz
  # versionCode = github.run_number + offset; raise the offset if Play ever needs a jump.
  VERSION_CODE_OFFSET: 100

jobs:
  release:
    name: Signed AAB to Play testing track
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve version and track
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TRACK: ${{ inputs.track }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow on a version tag (vX.Y.Z or vX.Y.Z-closed), not on a branch."
            exit 1
          fi
          if ! [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-closed)?$ ]]; then
            echo "::error::Tag '$REF_NAME' must look like v1.2.3 or v1.2.3-closed."
            exit 1
          fi
          version_name="${BASH_REMATCH[1]}"
          if [ -n "$INPUT_TRACK" ]; then
            track="$INPUT_TRACK"
          elif [ -n "${BASH_REMATCH[2]}" ]; then
            track="closed"
          else
            track="internal"
          fi
          case "$track" in
            internal) play_track="internal" ;;
            closed) play_track="alpha" ;;
            *) echo "::error::Unsupported track '$track'. Only internal and closed are allowed."; exit 1 ;;
          esac
          version_code=$((RUN_NUMBER + VERSION_CODE_OFFSET))
          {
            echo "name=$version_name"
            echo "code=$version_code"
            echo "track=$track"
            echo "play_track=$play_track"
          } >> "$GITHUB_OUTPUT"
          echo "versionName=$version_name versionCode=$version_code track=$track (Play: $play_track)"

      - uses: actions/checkout@v7

      # JDK 25 last = JAVA_HOME, required by the Gradle daemon toolchain; see ci-android.yml.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. See infra/README.md."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Decode google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 not set; building without google-services.json (Firebase not added yet)."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Build signed release bundle
        working-directory: android
        env:
          # ANDROID_KEYSTORE_PATH comes from GITHUB_ENV; build.gradle.kts reads these.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew bundleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Collect outputs
        id: outputs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist whatsnew
          aab="dist/duello-quiz-$VERSION_NAME.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$aab"
          cp android/app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          # upload-google-play expects whatsnew-<locale> files
          cp android/release-notes/az-AZ.txt whatsnew/whatsnew-az-AZ
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      # AAB and mapping stay as a workflow artifact only; the repo is public, so no
      # GitHub Release (that would make every test build publicly downloadable).
      - name: Keep AAB and R8 mapping as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/
          retention-days: 90

      - name: Check Play credentials
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON not set; skipping the Play upload. Upload the AAB manually (required for the very first release)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play (${{ steps.version.outputs.track }})
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ steps.outputs.outputs.aab }}
          track: ${{ steps.version.outputs.play_track }}
          # "draft" while the app has never been reviewed in Play Console; then "completed".
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          mappingFile: dist/mapping.txt
          whatsNewDirectory: whatsnew

      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/app/google-services.json
