<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <title>Duello Quiz feature graphic (Google Play, 1024 x 500)</title>
  <!--
    Spec: design/store/listing-az.md "Graphics". Light-theme token colours only:
    background scheme.primary #4355B9, back bubble scheme.tertiaryContainer #FFD8EA,
    front bubble #FFFFFF, glyph and gap ring #4355B9 (same layers as
    design/brand/ic-launcher-foreground.svg), name scheme.onPrimary #FFFFFF,
    decoration scheme.primaryContainer #DEE0FF at low opacity.
    Important content stays inside the central 924 x 400 box (x 50-974, y 50-450).
    Convert the text to outlines (or render with Inter installed) before exporting.
  -->
  <rect width="1024" height="500" fill="#4355B9"/>

  <!-- Decoration: faint oversized bubble outlines bleeding off the edges (no meaning, no text) -->
  <g fill="none" stroke="#DEE0FF" stroke-opacity="0.16" stroke-width="10" stroke-linejoin="round">
    <path transform="translate(90 -100)" d="M820,-40 H1000 A70,70 0 0 1 1070,30 V150 A70,70 0 0 1 1000,220 H900 L860,270 L850,220 H820 A70,70 0 0 1 750,150 V30 A70,70 0 0 1 820,-40 Z"/>
    <path transform="translate(-40 70)" d="M40,330 H200 A60,60 0 0 1 260,390 V500 A60,60 0 0 1 200,560 H40 A60,60 0 0 1 -20,500 V390 A60,60 0 0 1 40,330 Z"/>
  </g>
  <g fill="#DEE0FF" fill-opacity="0.10">
    <rect x="884" y="300" width="96" height="96" rx="16"/>
    <rect x="904" y="404" width="56" height="56" rx="12"/>
  </g>

  <!-- Brand mark: 108-unit launcher geometry, bbox x 25-80 / y 27-77, scaled 4.4 -> 242 x 220 at (114, 140) -->
  <g transform="translate(4 21.2) scale(4.4)">
    <path d="M56,38 H70 A10,10 0 0 1 80,48 V60 A10,10 0 0 1 72.5,69.7 L75,77 L64,70 H56 A10,10 0 0 1 46,60 V48 A10,10 0 0 1 56,38 Z" fill="#FFD8EA"/>
    <path d="M38,30 H52 A10,10 0 0 1 62,40 V52 A10,10 0 0 1 52,62 H40 L31,70 L28,56 V40 A10,10 0 0 1 38,30 Z" fill="#4355B9" stroke="#4355B9" stroke-width="6" stroke-linejoin="round"/>
    <path d="M38,30 H52 A10,10 0 0 1 62,40 V52 A10,10 0 0 1 52,62 H40 L31,70 L28,56 V40 A10,10 0 0 1 38,30 Z" fill="#FFFFFF"/>
    <path d="M39.2,40.5 A5.8,5.8 0 1 1 47.9,45.52 C46.2,46.5 45,47.4 45,49" fill="none" stroke="#4355B9" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="45" cy="56" r="2.5" fill="#4355B9"/>
  </g>

  <!-- App name (brand, not translated) -->
  <text x="400" y="279" fill="#FFFFFF" font-family="Inter, 'Inter SemiBold', Roboto, 'Noto Sans', Arial, sans-serif" font-size="80" font-weight="600" letter-spacing="-0.5">Duello Quiz</text>
</svg>
